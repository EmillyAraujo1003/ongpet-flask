<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Adoção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">ONGPet - Adoção Animal</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">Interesse em adotar: {{ pet.nome }}</h4>
                    </div>
                    <div class="card-body">
                        <!-- O formulário envia os dados usando o método POST -->
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Seu Nome Completo</label>
                                <input type="text" class="form-control" name="nome" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Telefone / WhatsApp</label>
                                <input type="tel" class="form-control" name="telefone" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Porque quer adotar o/a {{ pet.nome }}?</label>
                                <textarea class="form-control" name="motivo" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Enviar Pedido de Adoção</button>
                            <a href="/" class="btn btn-outline-secondary w-100 mt-2">Cancelar e Voltar</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
