<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apadrinhar Animal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">ONGPet - Adoção Animal</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0">Apadrinhar: {{ pet.nome }}</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Seu Nome Completo</label>
                                <input type="text" class="form-control" name="nome" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">O que deseja doar para o/a {{ pet.nome }}?</label>
                                <select class="form-select" name="doacao" required>
                                    <option value="" disabled selected>Escolha uma opção...</option>
                                    <option value="Saco de Ração (15kg)">Saco de Ração (15kg)</option>
                                    <option value="Kit de Medicamentos">Kit de Medicamentos e Vacinas</option>
                                    <option value="Cama e Brinquedos">Cama e Brinquedos</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-info w-100 text-white">Confirmar Apadrinhamento</button>
                            <a href="/" class="btn btn-outline-secondary w-100 mt-2">Cancelar</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
